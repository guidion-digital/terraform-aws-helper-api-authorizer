name: Tests plans

on:
  pull_request:
    branches: [acc]
    types: [opened, edited, synchronize]

jobs:
  test-workflow:
    uses: guidion-digital/release-workflows/.github/workflows/github-test-workflow.yaml@v2
    permissions:
      pull-requests: write
      contents: read

  # Named 'test' because branch protection on acc requires the 'test / completed' check
  test:
    needs: test-workflow
    uses: guidion-digital/terrappy/.github/workflows/tfc-test-helper-module-plan.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  release-dry-run:
    needs: test
    uses: guidion-digital/release-workflows/.github/workflows/github-release-tag-dry-run.yaml@v2
    with:
      branch: ${{ github.ref_name }}
